<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrated Smart Factory Platform | TMMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script defer src="/shim.js"></script>
<style>
:root{
  --red:#EB0A1E; --charcoal:#202124; --gray:#3C4043; --white:#FFFFFF; --bg:#F4F5F6; --border:#DADCE0;
  --blue:#315A78; --green:#27856B; --amber:#E6A23C; --crit:#D93025;
  --muted:#5F6368; --soft:#F8F9FA; --line:#ECEEF0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--charcoal);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-weight:600}
a{color:inherit}
button,input,select,textarea{font-family:inherit;line-height:1.5}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--white);color:var(--charcoal);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#C9081A}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Landing */
.landing{max-width:1100px;margin:0 auto;padding:44px 24px 56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.landing h1{font-size:28px;letter-spacing:-.015em;margin:36px 0 6px}
.hero{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:12px;padding:22px 24px;margin-top:28px}
.hero h2{font-size:24px;letter-spacing:-.015em}
.hero .company{font-size:14px;color:var(--gray);margin-top:4px}
.brand-sub{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.landing .lead{color:var(--muted);max-width:620px;margin-bottom:28px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.role-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--charcoal);font-size:14px}
.role-card:hover{border-color:var(--red)}
.role-top{display:flex;align-items:center;gap:12px}
.role-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.role-card h3{font-size:15.5px}
.role-pos{font-size:12.5px;color:var(--muted)}
.role-focus{font-size:13px;color:var(--gray)}
.role-go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:500;color:var(--red)}
.role-card.admin{background:var(--soft);border-style:dashed}
.landing .note{font-size:12.5px;color:var(--muted);margin-top:24px;max-width:720px}

/* Shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--white);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar .brand{padding:2px 8px 14px}
.nav-label{font-size:12px;color:var(--muted);padding:14px 10px 6px;font-weight:500}
.nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--gray);text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;margin-bottom:1px}
.nav a:hover{background:var(--soft)}
.nav a.active{background:#FDECEE;color:var(--red);font-weight:600;border-left-color:var(--red)}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.nav-toggle{display:none}
.nav a:focus-visible,.nav-toggle:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.progress > span.indet{width:35%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion: reduce){.progress > span.indet{animation:none;width:100%;opacity:.45}}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:16px}
.topbar .crumb{font-size:12px;color:var(--muted)}
.role-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.role-chip .role-icon{width:26px;height:26px;border-radius:7px;font-size:11px}
.content{padding:24px 28px 56px;max-width:1440px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:21px;letter-spacing:-.01em}
.page-head p{margin-top:4px;color:var(--muted);font-size:13px}

/* Grid and cards */
.grid{display:grid;gap:16px;margin-bottom:16px}
.grid.flat{margin-bottom:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;min-width:0;margin-bottom:16px}
.grid > .card{margin-bottom:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);min-height:50px}
.card-h h3{font-size:14px}
.card-b{padding:16px 18px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-label{font-size:12.5px;color:var(--muted)}
.kpi-value{font-size:26px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--green)} .down{color:var(--crit)}
.sub-h{font-size:13px;font-weight:600;margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:12px}
.mt{margin-top:12px}

/* Badges */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:#EEF0F2;color:var(--gray)}
.b-red{background:#FCE8E6;color:#B3261E}
.b-amber{background:#FDF3E1;color:#8A5A10}
.b-green{background:#E3F2EC;color:#1E6B55}
.b-blue{background:#E6EEF4;color:var(--blue)}
.tag{font-size:12px;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl select.mini,.tbl input.mini{padding:4px 8px;font-size:12.5px}
.tbl select.mini{min-width:112px}

/* Lists */
.list .item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:first-child{padding-top:0}
.list .item:last-child{border-bottom:none;padding-bottom:0}
.list .t{font-weight:500;font-size:13.5px}
.list .meta{font-size:12px;color:var(--muted);margin-top:2px}
.list .impact{font-size:12px;color:var(--green);margin-top:3px;font-weight:500}
.grow{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.num{width:22px;height:22px;border-radius:6px;background:var(--soft);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
ul.clean{margin:8px 0 0;padding-left:18px} ul.clean li{margin-bottom:4px}

/* Progress & mix */
.progress{height:8px;background:#EEF0F2;border-radius:99px;overflow:hidden;min-width:60px}
.progress.lg{height:12px}
.progress > span{display:block;height:100%;border-radius:99px}
.mix-row{margin-bottom:12px}
.mix-row:last-child{margin-bottom:0}
.mix-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mix-top span:first-child{font-weight:500}
.cell-bar{display:flex;align-items:center;gap:8px}
.cell-bar .progress{flex:1}

/* Line tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}
.tile b{display:block;font-weight:500;font-size:12.5px}
.tile .st{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.tile .st .dot{margin-top:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--gray);font-weight:500}
input,select,textarea{font-size:13.5px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--charcoal);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,90,120,.12)}
input[type=checkbox]{width:auto;accent-color:var(--red)}
input[type=range]{padding:0;border:none;accent-color:var(--red);box-shadow:none}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.check:last-child{border-bottom:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{width:auto;min-width:150px;padding:6px 10px;font-size:13px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--charcoal);border-bottom-color:var(--red);font-weight:500}

/* Work instructions */
.wi-item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--charcoal);margin-bottom:4px}
.wi-item:hover{background:var(--soft)}
.wi-item.active{border-color:var(--border);background:var(--soft)}
.wi-item .meta{font-size:12px;color:var(--muted)}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border-bottom:none}
.step input{margin-top:3px}
.step.done span{color:var(--muted);text-decoration:line-through}

/* Vision */
.vimg{width:100%;height:auto;display:block;border-radius:8px;background:#E9ECEF}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:460px}
.chat-log{flex:1;overflow-y:auto;padding:18px}
.msg{max-width:78%;margin-bottom:12px;padding:10px 14px;border-radius:12px;font-size:13.5px}
.msg.user{margin-left:auto;background:var(--charcoal);color:#fff;border-bottom-right-radius:4px}
.msg.bot{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot p{margin-bottom:6px} .msg.bot ol{margin:6px 0 8px;padding-left:20px}
.chat-sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.chat-in{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(32,33,36,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.modal-box{background:var(--white);border-radius:12px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--crit)}
.loading{display:grid;place-items:center;min-height:100vh;color:var(--muted)}
.callout{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--gray)}

/* ---------- Color layer ---------- */
.ric{width:46px;height:46px;border-radius:12px;background:var(--rc);color:#fff;display:grid;place-items:center;flex:none}
.ric svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ric.sm{width:34px;height:34px;border-radius:9px}
.ric.sm svg{width:19px;height:19px}

.land{min-height:100vh}
.land-top{background:radial-gradient(circle at 88% 10%, rgba(49,90,120,.55), transparent 42%),radial-gradient(circle at 10% 120%, rgba(39,133,107,.25), transparent 40%),#202124;border-bottom:3px solid var(--red);padding:30px 0 84px;color:#fff}
.land-inner{max-width:1100px;margin:0 auto;padding:0 24px}
.land-top .brand{color:#fff}
.hero-title{font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:44px}
.hero-sub{font-size:15px;color:#C4C9D0;margin-top:6px}
.land-body{margin-top:-56px;padding-bottom:56px}
.land-body .select{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.land-body .select h1{font-size:20px;margin:0}
.land-body .select p{color:var(--muted);font-size:13px;margin-top:3px}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.role-card{background:var(--tint);border:1px solid rgba(32,33,36,.07);border-top:4px solid var(--rc);border-radius:12px;padding:20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:14px;color:var(--charcoal);font-size:14px;transition:box-shadow .15s,transform .15s}
.role-card:hover{box-shadow:0 6px 20px rgba(32,33,36,.10);transform:translateY(-1px)}
.role-card h3{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.85);border:1px solid rgba(32,33,36,.08);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--gray)}
.role-go{margin-top:auto;font-size:13px;font-weight:600;color:var(--rc)}
.land .note{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:720px}

.sidebar{background:#202124;border-right:none;color:#E8EAED}
.sidebar .brand{color:#fff}
.sidebar .brand-sub{color:#9AA0A6}
.side-role{display:flex;gap:10px;align-items:center;background:#3C4043;border-radius:10px;padding:10px;margin:2px 2px 4px;font-size:13px;font-weight:500;color:#fff;line-height:1.3}
.nav-label{color:#9AA0A6}
.nav a{color:#C4C9D0}
.nav a:hover{background:#3C4043;color:#fff}
.nav a.active{background:rgba(235,10,30,.20);color:#fff;border-left-color:var(--red)}
.side-foot{border-top-color:#3C4043;color:#9AA0A6}
.topbar{border-top:3px solid var(--rc)}
.page-head{background:var(--tint);border:1px solid rgba(32,33,36,.06);border-left:4px solid var(--rc);border-radius:12px;padding:16px 20px;align-items:center}
.ph-left{display:flex;gap:14px;align-items:center}
.card-h{background:#F8F9FA;border-radius:12px 12px 0 0}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--rc,var(--red))}
.kpi{border-top:3px solid var(--k,var(--blue))}
.grid > .kpi:nth-child(4n+1){--k:#315A78}
.grid > .kpi:nth-child(4n+2){--k:#27856B}
.grid > .kpi:nth-child(4n+3){--k:#E6A23C}
.grid > .kpi:nth-child(4n+4){--k:#3C4043}

@media (prefers-reduced-motion: reduce){.toast{transition:none}}
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21,.g12{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  .g2{grid-template-columns:1fr}
  .content{padding:18px 16px 40px}
  .topbar{padding:0 16px}
  .form-2{grid-template-columns:1fr}
  .nav-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:4px;padding:10px 12px;border:1px solid #5F6368;border-radius:10px;background:#3C4043;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
  .nav-toggle::after{content:"+";font-size:18px;line-height:1}
  .sidebar.nav-open .nav-toggle::after{content:"−"}
  .sidebar .nav{display:none;max-height:55vh;overflow-y:auto;margin-top:6px}
  .sidebar.nav-open .nav{display:block}
}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-h"><h3 id="mTitle"></h3><button class="btn ghost sm" onclick="closeModal()" aria-label="Close">✕</button></div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="mSave" onclick="modalOk()">Save</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
/* =========================================================
   Smart Factory Portal — client
   All figures are simulated. Role selection simulates access control only.
   ========================================================= */
const $ = s => document.querySelector(s);
const PT = ['ICE', 'HEV', 'PHEV', 'BEV'];
const PT_COLOR = { ICE: '#6B7A90', HEV: '#27856B', PHEV: '#E6A23C', BEV: '#315A78' };
const C = { red: '#EB0A1E', charcoal: '#202124', gray: '#3C4043', blue: '#315A78', green: '#27856B', amber: '#E6A23C', crit: '#D93025', muted: '#5F6368', grid: '#ECEEF0', light: '#C4C9D0' };
const COLLECTIONS = ['users','permissions','masterData','alertConfig','workInstructions','simSettings','alerts','workOrders','capa','changeRequests','engChanges','inspections','defects','aiRecs','materialFlow','audit'];

let DB = null, ROLE = null, PAGE = 'overview', charts = {}, afterQ = [], modalSave = null;
const STATE = {
  wiSel: {}, wiChecks: {}, simMix: null, chat: [],
  lab: { line: 'L02', ct: 5, av: 2, df: 20 },
  trace: { line: '', cat: '', q: '' },
  alertFilter: 'Active', masterTab: 'lines', permRole: 'production', rcaMachine: 'M-102', auditQ: ''
};

const ICONS = {
  production: '<svg viewBox="0 0 24 24"><path d="M3 20V9l5 3V9l5 3V6l8 4v10z"/><path d="M7 16h2M11.5 16h2M16 16h2"/></svg>',

/* ---------- Domain helpers ---------- */
function M() {
  const hr = DB.hourly, open = DB.alerts.filter(a => a.status !== 'Resolved'), s = DB.simSettings;
  return {
    output: sum(hr.actual), target: sum(hr.target),
    attainment: sum(hr.actual) / sum(hr.target) * 100,
    running: DB.lines.filter(l => l.status === 'Running').length, totalLines: DB.lines.length,
    openAlerts: open.length, critical: open.filter(a => a.severity === 'Critical').length,
    openWO: DB.workOrders.filter(w => w.status !== 'Completed').length,
    highRisk: DB.equipment.filter(e => e.risk >= 70).length,
    downtime: sum(DB.equipment.map(e => e.downtime)),
    openCA: DB.capa.filter(c => c.status !== 'Closed').length,
    shortages: DB.materials.filter(m => cover(m) < 2).length,
    plansAwaiting: DB.changeRequests.filter(r => ['Engineering Review', 'Awaiting Approval'].includes(r.status)).length,
    forecast: forecastMonths(1)[0].total,
    util: s.plannedVolume / s.monthlyCapacity * 100
  };
}
function cover(m) { return m.stock / m.daily; }
function stockStatus(m) { const c = cover(m); return c < 2 ? 'Shortage' : c < 4 ? 'Low Stock' : 'OK'; }
function openAlerts() { return DB.alerts.filter(a => a.status !== 'Resolved'); }
const SEV_ORDER = { Critical: 0, High: 1, Medium: 2, Low: 3 };
function bySeverity(a, b) { return SEV_ORDER[a.severity] - SEV_ORDER[b.severity]; }
function topRecs(n) {
  const o = { High: 0, Medium: 1, Low: 2 };
  return DB.aiRecs.filter(r => r.status !== 'Deferred').sort((a, b) => o[a.priority] - o[b.priority]).slice(0, n);
}
function mixText(m) { return PT.map(p => m[p]).join(' / '); }

function forecastMonths(n) {
  const s = DB.simSettings, out = [], d = new Date();
  for (let i = 0; i < n; i++) {
    const m = new Date(d.getFullYear(), d.getMonth() + 1 + i, 1);
    const row = { label: m.toLocaleString('en-US', { month: 'short', year: '2-digit' }) };
    PT.forEach(p => { row[p] = Math.round(s.baseDemand[p] * Math.pow(1 + s.growth[p] / 100, i)); });
    row.total = sum(PT.map(p => row[p]));
    out.push(row);
  }
  return out;
}
function evaluateMix(mix, volume) {
  const s = DB.simSettings; volume = volume || s.plannedVolume;
  const units = {}; PT.forEach(p => { units[p] = Math.round(volume * mix[p] / 100); });
  const fc = forecastMonths(1)[0];
  const coverage = sum(PT.map(p => Math.min(units[p], fc[p]))) / fc.total * 100;
  const modules = sum(PT.map(p => units[p] * (s.batteryModulesPerUnit[p] || 0)));
  const moduleGap = modules - s.batterySupplyPerMonth;
  const mods = PT.filter(p => s.maxShare[p] != null && mix[p] > s.maxShare[p]);
  const lead = 2 + (moduleGap > 0 ? 3 : 0) + (mods.length ? 8 : 0);
  return { units, fc, coverage, util: volume / s.monthlyCapacity * 100, modules, moduleGap, mods, lead, total: sum(PT.map(p => +mix[p] || 0)) };
}
function capacityIssues() {
  const s = DB.simSettings, out = [];
  forecastMonths(6).forEach(m => {
    if (m.total > s.monthlyCapacity) out.push({ title: `${m.label}: total demand ${fmt(m.total)} exceeds capacity ${fmt(s.monthlyCapacity)}`, meta: 'Plant capacity' });
    Object.keys(s.maxShare).forEach(p => {
      const limit = Math.round(s.maxShare[p] / 100 * s.plannedVolume);
      if (m[p] > limit) out.push({ title: `${m.label}: ${p} demand ${fmt(m[p])} above line limit ${fmt(limit)}`, meta: `${p} limited to ${s.maxShare[p]}% of planned volume without equipment changes` });
    });
  });
  return out;
}

function alertList(items) {
  if (!items.length) return empty('No active alerts.');
  return `<div class="list">${items.map(a => `<div class="item"><span class="dot" style="background:${sevDot(a.severity)}"></span>
    <div class="grow"><div class="t">${h(a.title)}</div><div class="meta">${h(a.line)}, ${h(a.type)}, ${h(a.time)}. Owner: ${h(a.owner)}</div></div>${badge(a.status)}</div>`).join('')}</div>`;
}
function recList(recs) {
  if (!recs.length) return empty('No recommendations right now.');
  return `<div class="list">${recs.map((r, i) => `<div class="item"><div class="num">${i + 1}</div>
    <div class="grow"><div class="t">${h(r.title)}</div><div class="meta">${h(r.evidence)}</div><div class="impact">${h(r.impact)}</div></div>${badge(r.priority)}</div>`).join('')}</div>`;
}
function simpleList(items) {
  if (!items.length) return empty('Nothing to show.');
  return `<div class="list">${items.map(i => `<div class="item">${i.dot ? `<span class="dot" style="background:${i.dot}"></span>` : ''}<div class="grow"><div class="t">${i.title}</div>${i.meta ? `<div class="meta">${i.meta}</div>` : ''}</div>${i.right || ''}</div>`).join('')}</div>`;
}
function mixBars(mix) {
  return `<div>${PT.map(p => `<div class="mix-row"><div class="mix-top"><span>${p}</span><span>${mix[p]}%</span></div>${progress(mix[p], PT_COLOR[p], true)}</div>`).join('')}</div>`;
}
function lineTiles() {
  const col = { Running: C.green, Down: C.crit, Changeover: C.amber, Idle: C.light };
  return `<div class="tiles">${DB.lines.map(l => `<div class="tile"><b>${h(l.name)}</b><div class="st"><span class="dot" style="background:${col[l.status] || C.light}"></span>${h(l.status)}, ${fmt(l.actual / l.target * 100, 0)}%</div></div>`).join('')}</div>`;
}
function streamSummary() {
  const s = DB.simSettings, cur = s.currentMix, rec = s.recommendedMix;
  const diffs = PT.filter(p => rec[p] !== cur[p]).map(p => `${p} ${rec[p] > cur[p] ? '+' : ''}${rec[p] - cur[p]} pt`);
  const ec = evaluateMix(cur), er = evaluateMix(rec);
  const pending = DB.changeRequests.find(r => r.status === 'Awaiting Approval');
  let btn = '';
  if (allowed('stream-approval')) btn = `<button class="btn sm" onclick="go('stream-approval')">Review requests</button>`;
  else if (allowed('optimizer')) btn = `<button class="btn sm" onclick="go('optimizer')">Open optimizer</button>`;
  const reco = diffs.length
    ? `<p>Adjust the mix: <b>${diffs.join(', ')}</b>.</p>
       <ul class="clean"><li>Demand coverage ${fmt(ec.coverage, 1)}% to <b>${fmt(er.coverage, 1)}%</b></li>
       <li>Battery modules ${fmt(er.modules)} per month (supply ${fmt(s.batterySupplyPerMonth)})</li>
       <li>Estimated lead time ${er.lead} weeks</li></ul>
       ${pending ? `<p class="muted small mt">${h(pending.id)} is awaiting management approval.</p>` : ''}`
    : '<p>The current allocation matches the recommendation. No change needed.</p>';
  return card('Production stream summary', `<div class="grid g3 flat">
    <div><div class="sub-h">Current allocation</div>${mixBars(cur)}</div>
    <div><div class="sub-h">AI recommended allocation</div>${mixBars(rec)}</div>
    <div><div class="sub-h">Recommendation</div>${reco}</div></div>`, { right: btn });
}

function paretoChart(id) {
  const P = DB.pareto.slice().sort((a, b) => b.count - a.count), tot = sum(P.map(p => p.count));
  let acc = 0; const cum = P.map(p => +((acc += p.count) / tot * 100).toFixed(1));
  mkChart(id, 'bar', { labels: P.map(p => p.category), datasets: [
    ds('Cumulative %', cum, C.charcoal, { type: 'line', yAxisID: 'y1', pointRadius: 3, borderWidth: 1.5, tension: 0 }),
    barDs('Defects', P.map(p => p.count), C.blue)
  ] }, { scales: { y1: { position: 'right', min: 0, max: 100, grid: { display: false }, border: { display: false }, ticks: { callback: v => v + '%' } } } });
}
function qualityTrendChart(id) {
  const t = DB.trend;
  mkChart(id, 'line', { labels: t.labels, datasets: [

function wiPage(aud, title, desc) {
  const list = DB.workInstructions.filter(w => w.audience === aud);
  let html = pageHead(title, desc);
  if (!list.length) return html + card('', empty('No work instructions yet. The System Administrator can add them.'));
  const w = list.find(x => x.id === STATE.wiSel[aud]) || list[0];
  const checks = STATE.wiChecks[w.id] || [];
  const done = checks.filter(Boolean).length;
  html += `<div class="grid g12">
    ${card('Instructions', list.map(x => `<button class="wi-item ${x.id === w.id ? 'active' : ''}" onclick="STATE.wiSel['${aud}']='${x.id}';refresh()">
      <div>${h(x.title)}</div><div class="meta">${x.id}, ${h(x.category)}, ${x.steps.length} steps</div></button>`).join(''))}
    ${card(h(w.title), `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="muted small">${w.id}, ${h(w.category)}</span><span class="small">${done} of ${w.steps.length} done</span></div>
      ${progress(done / w.steps.length * 100, done === w.steps.length ? C.green : C.blue)}
      <div class="mt">${w.steps.map((s, i) => `<label class="step ${checks[i] ? 'done' : ''}"><input type="checkbox" ${checks[i] ? 'checked' : ''} onchange="toggleStep('${w.id}',${i},this.checked)"><span>${i + 1}. ${h(s)}</span></label>`).join('')}</div>`,
      { right: `<button class="btn sm" onclick="STATE.wiChecks['${w.id}']=[];refresh()">Clear</button>` })}</div>`;
  return html;
}
function toggleStep(id, i, on) { (STATE.wiChecks[id] = STATE.wiChecks[id] || [])[i] = on; refresh(); }
function openWI(id) {
  const w = DB.workInstructions.find(x => x.id === id);
  if (!w) return toast('Work instruction not found', 'err');
  openModal(w.title, `<p class="muted small" style="margin-bottom:10px">${w.id}, ${h(w.category)}</p><ol style="padding-left:20px;margin:0">${w.steps.map(s => `<li style="margin-bottom:8px">${h(s)}</li>`).join('')}</ol>`);
}
function pgWorkInstr() { return wiPage('production', 'Digital work instructions', 'Work instructions, shift checklists and abnormality check steps'); }

function pgAlertReport() {
  const f = STATE.alertFilter;
  const items = DB.alerts.filter(a => f === 'All' || (f === 'Active' ? a.status !== 'Resolved' : a.status === f)).sort(bySeverity);
  let html = pageHead('Alert & action reporting', 'Report a problem, view alerts and follow their handling status');

    ${field('What happened?', ta('aDesc', '', 3))}
    <button class="btn primary" onclick="submitAlert()">Report alert</button>` : empty('Your role can view alerts only.');
  html += `<div class="grid g12">${card('Report a problem', form)}
    ${card('Alerts', table([
      ['Severity', a => badge(a.severity)],
      ['Alert', a => `<b>${h(a.title)}</b><div class="muted small">${a.id}, ${h(a.line)}, ${a.time}</div>`],
      ['Owner', a => h(a.owner)],
      ['Status', a => badge(a.status)],
      ['', a => !can('edit') ? '' : a.status === 'Open' ? `<button class="btn sm" onclick="setAlert('${a.id}','In Progress')">Start</button>` : a.status === 'In Progress' ? `<button class="btn sm" onclick="setAlert('${a.id}','Resolved')">Resolve</button>` : '', 'r']
    ], items, 'No alerts match this filter.'), { right: sel('aFilter', ['Active', 'Open', 'In Progress', 'Resolved', 'All'], f, `style="width:auto" onchange="STATE.alertFilter=this.value;refresh()"`) })}</div>`;

function addAlert(a) {
  const owner = { Production: 'Team Leader', Quality: 'Quality Engineer', Maintenance: 'Maintenance Engineer', Material: 'Production Planner' }[a.type] || 'Team Leader';
  const id = nextId(DB.alerts, 'AL-', 1000);
  DB.alerts.unshift(Object.assign({ id, time: nowHM(), status: 'Open', owner, escalation: 0 }, a));
  persist('alerts', 'Report alert', `${id} ${a.title}`);
  if (PAGE) refresh();
}
function submitAlert() {
  const d = val('aDesc').trim();
  if (!d) return toast('Describe what happened before reporting', 'err');
  addAlert({ line: val('aLine'), type: val('aType'), severity: val('aSev'), title: d });
  toast('Alert reported');
}
function setAlert(id, status) {
  const a = DB.alerts.find(x => x.id === id); if (!a) return;
  a.status = status;
  persist('alerts', 'Update alert', `${id} set to ${status}`);
  toast(`Alert ${status.toLowerCase()}`);
  refresh();
}

const STOP = ['what', 'the', 'when', 'how', 'for', 'and', 'with', 'about', 'does', 'are', 'show', 'active', 'should', 'there', 'any', 'can', 'you', 'from', 'this', 'that', 'need', 'please', 'tell'];
function pgChatbot() {
  if (!STATE.chat.length) STATE.chat = [{ who: 'bot', html: '<p>Hi. I can find work instructions and information about active alerts. Ask a question or pick a suggestion below.</p>' }];
  const sug = ['What to do when the line stops?', 'Alerts on Body Weld 2', 'How do I verify torque tools?', 'Shift start checklist'];
  return pageHead('AI chatbot', 'Search work instructions and alert information. Rule-based demo assistant.') +
    `<div class="card chat"><div class="chat-log" id="chatLog">${STATE.chat.map(c => `<div class="msg ${c.who}">${c.html}</div>`).join('')}</div>
      <div class="chat-sug">${sug.map(s => `<button class="btn sm" onclick="askBot(${h(js(s))})">${h(s)}</button>`).join('')}</div>
      <div class="chat-in"><input id="chatQ" placeholder="Ask about a work instruction or an alert" onkeydown="if(event.key==='Enter')askBot()"><button class="btn primary" onclick="askBot()">Send</button></div></div>`;
}
function askBot(q) {
  q = (q || val('chatQ')).trim(); if (!q) return;
  STATE.chat.push({ who: 'user', html: h(q) }, { who: 'bot', html: botAnswer(q) });
  refresh();
  const log = $('#chatLog'); if (log) log.scrollTop = log.scrollHeight;
  const i = $('#chatQ'); if (i) i.focus();
}
function botAnswer(q) {
  const words = q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.includes(w)).map(w => w.replace(/(ing|s)$/, ''));
  const score = txt => { const t = txt.toLowerCase(); return words.reduce((a, w) => a + (t.includes(w) ? 1 : 0), 0); };
  const pool = ROLE === 'production' ? DB.workInstructions.filter(w => w.audience === 'production') : DB.workInstructions;
  const wis = pool.map(w => ({ w, s: score(w.title + ' ' + w.category) * 2 + score(w.steps.join(' ')) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const alerts = openAlerts().map(a => ({ a, s: score(a.title + ' ' + a.line + ' ' + a.type) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const wantsAlerts = /alert|issue|problem|abnormal|status/.test(q.toLowerCase());
  let out = '';
  if (wis.length && (!wantsAlerts || !alerts.length || wis[0].s > 2)) {
    const w = wis[0].w;
    out += `<p>Best match: <b>${h(w.title)}</b> (${w.id})</p><ol>${w.steps.map(s => `<li>${h(s)}</li>`).join('')}</ol>`;
    if (wis[1]) out += `<p class="small muted">Also related: ${wis.slice(1, 3).map(x => h(x.w.title)).join(', ')}</p>`;
  }
  const al = alerts.length ? alerts.slice(0, 3).map(x => x.a) : (wantsAlerts ? openAlerts().sort(bySeverity).slice(0, 3) : []);
  if (al.length) out += `<p>${alerts.length ? 'Related active alerts' : 'Current active alerts'}:</p>` + al.map(a => `<p>${badge(a.severity)} ${h(a.title)} <span class="small muted">(${h(a.line)}, ${h(a.status)}, owner ${h(a.owner)})</span></p>`).join('');
  return out || '<p>No matching work instruction or alert found. Try keywords such as line stop, torque, conveyor, or a line name.</p>';
}

    DB.changeRequests.filter(r => ['Approved', 'Rejected'].includes(r.status))));
  return html;
}
function decide(id, decision) {
  const r = DB.changeRequests.find(x => x.id === id);
  openModal(`${decision === 'Approved' ? 'Approve' : 'Reject'} ${r.id}`, `<p style="margin-bottom:12px">${h(r.title)}. Mix ${mixText(r.mix)}.</p>${field('Comment', ta('decNote', '', 3))}`, () => {
    r.status = decision; r.comment = val('decNote').trim() || decision;
    if (decision === 'Approved') { DB.simSettings.currentMix = Object.assign({}, r.mix); persist('simSettings'); }
    persist('changeRequests', decision === 'Approved' ? 'Approve stream change' : 'Reject stream change', `${r.id} ${r.title}`);
    toast(`Request ${decision.toLowerCase()}`); refresh();
  }, decision === 'Approved' ? 'Approve' : 'Reject');
}

function pgSimResults() {
  const s = DB.simSettings;
  const sc = [{ name: 'Baseline (current)', mix: s.currentMix }, { name: 'AI recommended', mix: s.recommendedMix }]
    .concat(DB.changeRequests.filter(r => !['Approved', 'Rejected'].includes(r.status)).map(r => ({ name: `${r.id} ${r.title}`, mix: r.mix })))
    .map(x => Object.assign(x, { e: evaluateMix(x.mix) }));
  let html = pageHead('Simulation results', 'Compare the baseline with alternative scenarios before applying a change');
  html += card('Demand coverage and capacity use by scenario', chartBox('cSim', 260));
  mkChart('cSim', 'bar', { labels: sc.map(x => x.name), datasets: [barDs('Demand coverage %', sc.map(x => +x.e.coverage.toFixed(1)), C.green), barDs('Capacity use %', sc.map(x => +x.e.util.toFixed(1)), C.blue)] },
    { scales: { y: Object.assign({ beginAtZero: false, suggestedMin: 80, max: 100 }, pctTick) } });
  html += card('Scenario comparison', table([
    ['Scenario', x => `<b>${h(x.name)}</b>`], ['Mix ICE/HEV/PHEV/BEV', x => mixText(x.mix)], ['Demand coverage', x => fmt(x.e.coverage, 1) + '%', 'r'],
    ['Battery modules', x => fmt(x.e.modules) + (x.e.moduleGap > 0 ? ` <span class="down small">(+${fmt(x.e.moduleGap)})</span>` : ''), 'r'],
    ['Equipment change', x => x.e.mods.length ? badge('Warning') : badge('OK')], ['Lead time', x => x.e.lead + ' weeks', 'r']
  ], sc));
  return html;
}

function pgCi() {
  const C2 = DB.ciItems;
  let html = pageHead('Continuous improvement tracking', 'Baseline, target, actual result and status of improvement actions');
  html += `<div class="grid g3">${['On Track', 'At Risk', 'Off Track'].map(s => kpi(s, C2.filter(c => c.status === s).length, 'Initiatives')).join('')}</div>`;
  html += card('Initiatives', table([
    ['Initiative', c => `<b>${h(c.initiative)}</b><div class="muted small">${c.id}, ${h(c.owner)}</div>`], ['KPI', c => h(c.kpi)],
    ['Baseline', c => c.baseline, 'r'], ['Target', c => c.target, 'r'], ['Actual', c => `<b>${c.actual}</b>`, 'r'],
    ['Progress', c => { const p = (c.actual - c.baseline) / (c.target - c.baseline) * 100; return cellBar(p, fmt(Math.max(0, p), 0) + '%', c.status === 'On Track' ? C.green : c.status === 'At Risk' ? C.amber : C.crit); }],
    ['Status', c => badge(c.status)]
  ], C2));
  return html;
}

/* =========================================================
   System Administrator
   ========================================================= */
const OP_ROLES = ['production', 'engineering', 'quality', 'logistics', 'plant'];
function pgUsers() {
  let html = pageHead('User management', 'Add, edit and deactivate demo accounts and assign roles', '<button class="btn primary" onclick="editUser()">Add user</button>');
  html += card('Users', table([
    ['Name', u => `<b>${h(u.name)}</b><div class="muted small">${h(u.email)}</div>`], ['Position', u => h(u.position)],
    ['Role', u => h(ROLES[u.role] ? ROLES[u.role].name : u.role)], ['Status', u => badge(u.status)],
    ['', u => `<div class="row" style="justify-content:flex-end"><button class="btn sm" onclick="editUser('${u.id}')">Edit</button><button class="btn sm" onclick="toggleUser('${u.id}')">${u.status === 'Active' ? 'Deactivate' : 'Activate'}</button></div>`, 'r']
  ], DB.users));
  return html;
}
function editUser(id) {
  const u = DB.users.find(x => x.id === id) || { name: '', email: '', position: '', role: 'production' };
  openModal(id ? 'Edit user' : 'Add user', `${field('Name', inp('uName', u.name))}${field('Email', inp('uMail', u.email, 'email'))}
    <div class="form-2">${field('Position', inp('uPos', u.position))}${field('Role', sel('uRole', Object.keys(ROLES).map(k => [k, ROLES[k].name]), u.role))}</div>`, () => {
    const name = val('uName').trim(), email = val('uMail').trim();
    if (!name || !email) { toast('Enter a name and email', 'err'); return false; }
    if (id) Object.assign(u, { name, email, position: val('uPos'), role: val('uRole') });
    else DB.users.push({ id: nextId(DB.users, 'U', 0, 2), name, email, position: val('uPos'), role: val('uRole'), status: 'Active' });
    persist('users', id ? 'Edit user' : 'Add user', `${name} (${ROLES[val('uRole')].name})`); toast('User saved'); refresh();
  }, id ? 'Save changes' : 'Add user');
}
function toggleUser(id) {
  const u = DB.users.find(x => x.id === id); u.status = u.status === 'Active' ? 'Inactive' : 'Active';
  persist('users', u.status === 'Active' ? 'Activate user' : 'Deactivate user', u.name); toast(`User ${u.status.toLowerCase()}`); refresh();
}

function pgPermissions() {
  const r = STATE.permRole, p = DB.permissions[r] || {};
  const on = p.features || FEATURES[r].map(f => f[0]);
  const act = p.actions || { edit: true, approve: r === 'plant' };
  let html = pageHead('Role & permissions', 'Choose which modules each role can see and which actions it may take');
  html += `<div class="tabs">${OP_ROLES.map(k => `<button class="tab ${k === r ? 'active' : ''}" onclick="STATE.permRole='${k}';refresh()">${ROLES[k].name}</button>`).join('')}</div>`;
  html += `<div class="grid g2">
    ${card('Visible modules', `<p class="muted small" style="margin-bottom:6px">Plant Overview and My Dashboard are always visible.</p>` + FEATURES[r].map(f => `<label class="check"><input type="checkbox" class="permF" value="${f[0]}" ${on.includes(f[0]) ? 'checked' : ''}>${f[1]}</label>`).join(''))}
    ${card('Allowed actions', `<label class="check"><input type="checkbox" id="pEdit" ${act.edit ? 'checked' : ''}>Create and edit records (report alerts, update status, submit requests)</label>
      <label class="check"><input type="checkbox" id="pApprove" ${act.approve ? 'checked' : ''}>Approve changes and accept AI recommendations</label>
      <div class="callout mt">This prototype simulates access control in the browser. Real security needs authentication and server-side checks.</div>
      <div class="row mt"><button class="btn primary" onclick="savePerms()">Save permissions</button><button class="btn" onclick="resetPerms()">Restore defaults</button></div>`)}</div>`;
  return html;
}
function savePerms() {
  const r = STATE.permRole;
  const features = Array.from(document.querySelectorAll('.permF')).filter(c => c.checked).map(c => c.value);
  DB.permissions = Object.assign({}, DB.permissions, { [r]: { features, actions: { edit: $('#pEdit').checked, approve: $('#pApprove').checked } } });
  persist('permissions', 'Update permissions', `${ROLES[r].name}: ${features.length} modules`); toast('Permissions saved'); refresh();
}
function resetPerms() {
  const r = STATE.permRole; const p = Object.assign({}, DB.permissions); delete p[r]; DB.permissions = p;
  persist('permissions', 'Restore default permissions', ROLES[r].name); toast('Defaults restored'); refresh();
}

const MASTER_TABS = [['lines', 'Production lines'], ['machines', 'Machines'], ['models', 'Vehicle models'], ['defectCategories', 'Defect categories'], ['materialCategories', 'Material categories']];
function pgMaster() {
  const k = STATE.masterTab, list = DB.masterData[k] || [];
  let html = pageHead('Master data', 'Manage lines, machines, vehicle models, defect categories and material categories');
  html += `<div class="tabs">${MASTER_TABS.map(t => `<button class="tab ${t[0] === k ? 'active' : ''}" onclick="STATE.masterTab='${t[0]}';refresh()">${t[1]}</button>`).join('')}</div>`;
  html += `<div class="grid g12">${card('Add item', `${field('Name', inp('mNew', '', 'text', `onkeydown="if(event.key==='Enter')masterAdd()"`))}<button class="btn primary" onclick="masterAdd()">Add</button>`)}
    ${card(`${MASTER_TABS.find(t => t[0] === k)[1]} (${list.length})`, simpleList(list.map((v, i) => ({ title: h(v), right: `<button class="btn sm ghost" onclick="masterDel(${i})">Remove</button>` }))))}</div>`;
  return html;
}
function masterAdd() {
  const v = val('mNew').trim(), k = STATE.masterTab; if (!v) return;
  if (DB.masterData[k].includes(v)) return toast('This item already exists', 'err');
  DB.masterData[k].push(v); persist('masterData', 'Add master data', `${k}: ${v}`); toast('Item added'); refresh();
}
function masterDel(i) {
  const k = STATE.masterTab, v = DB.masterData[k][i];
  DB.masterData[k].splice(i, 1); persist('masterData', 'Remove master data', `${k}: ${v}`); toast('Item removed'); refresh();
}

function pgAlertConfig() {
  let html = pageHead('Alert configuration', 'Set severity, thresholds, owners and escalation rules', '<button class="btn primary" onclick="saveAlertConfig()">Save changes</button>');
  html += card('Alert rules', table([
    ['Area', a => badge(a.type)], ['Metric', a => `<b>${h(a.metric)}</b>`],
    ['Threshold', (a) => `<input class="mini" id="ac_th_${a.id}" value="${h(a.threshold)}" style="min-width:120px">`],
    ['Severity', a => sel('ac_sev_' + a.id, ['Low', 'Medium', 'High', 'Critical'], a.severity, 'class="mini"')],
    ['Owner', a => `<input class="mini" id="ac_ow_${a.id}" value="${h(a.owner)}" style="min-width:140px">`],
    ['Escalate after (min)', a => `<input class="mini" type="number" min="5" id="ac_min_${a.id}" value="${a.escalateMin}" style="width:80px">`],
    ['Escalate to', a => `<input class="mini" id="ac_to_${a.id}" value="${h(a.escalateTo)}" style="min-width:150px">`]
  ], DB.alertConfig));
  return html;
}
function saveAlertConfig() {
  DB.alertConfig.forEach(a => {
    a.threshold = val('ac_th_' + a.id); a.severity = val('ac_sev_' + a.id); a.owner = val('ac_ow_' + a.id);
    a.escalateMin = +val('ac_min_' + a.id) || a.escalateMin; a.escalateTo = val('ac_to_' + a.id);
  });
  persist('alertConfig', 'Update alert configuration', `${DB.alertConfig.length} rules saved`); toast('Alert rules saved'); refresh();
}

function pgWiMgmt() {
  let html = pageHead('Work instruction management', 'Add or edit demo work instructions', '<button class="btn primary" onclick="editWI()">Add instruction</button>');
  html += card('Work instructions', table([
    ['ID', w => w.id], ['Title', w => `<b>${h(w.title)}</b>`], ['Category', w => h(w.category)],
    ['Audience', w => w.audience === 'production' ? 'Production & Operations' : 'Engineering & Maintenance'], ['Steps', w => w.steps.length, 'r'],
    ['', w => `<div class="row" style="justify-content:flex-end"><button class="btn sm" onclick="editWI('${w.id}')">Edit</button><button class="btn sm ghost" onclick="deleteWI('${w.id}')">Delete</button></div>`, 'r']
  ], DB.workInstructions));
  return html;
}
function editWI(id) {
  const w = DB.workInstructions.find(x => x.id === id) || { title: '', category: 'Checklist', audience: 'production', steps: [] };
  openModal(id ? 'Edit work instruction' : 'Add work instruction', `${field('Title', inp('wTitle', w.title))}
    <div class="form-2">${field('Category', sel('wCat', ['Checklist', 'Abnormality', 'Inspection', 'Troubleshooting', 'Preventive Maintenance'], w.category))}
    ${field('Audience', sel('wAud', [['production', 'Production & Operations'], ['engineering', 'Engineering & Maintenance']], w.audience))}</div>
    ${field('Steps (one per line)', ta('wSteps', w.steps.join('\n'), 6))}`, () => {
    const title = val('wTitle').trim(), steps = val('wSteps').split('\n').map(s => s.trim()).filter(Boolean);
    if (!title || !steps.length) { toast('Enter a title and at least one step', 'err'); return false; }
    const aud = val('wAud');
    if (id) Object.assign(w, { title, category: val('wCat'), audience: aud, steps });
    else {
      const pre = aud === 'production' ? 'WI-P' : 'WI-E';
      DB.workInstructions.push({ id: nextId(DB.workInstructions.filter(x => x.id.startsWith(pre)), pre, 0, 2), title, category: val('wCat'), audience: aud, steps });
    }
    persist('workInstructions', id ? 'Edit work instruction' : 'Add work instruction', title); toast('Work instruction saved'); refresh();
  }, 'Save instruction');
}
function deleteWI(id) {
  const w = DB.workInstructions.find(x => x.id === id);
  openModal('Delete work instruction', `<p>Delete <b>${h(w.title)}</b>? This cannot be undone, except by resetting the demo data.</p>`, () => {
    DB.workInstructions = DB.workInstructions.filter(x => x.id !== id);
    persist('workInstructions', 'Delete work instruction', `${id} ${w.title}`); toast('Work instruction deleted'); refresh();
  }, 'Delete');
}

function pgSimSettings() {
  const s = DB.simSettings;
  const ptRow = (prefix, obj, step) => `<div class="grid g4 flat">${PT.map(p => field(p, inp(`${prefix}_${p}`, obj[p], 'number', `step="${step}"`))).join('')}</div>`;
  let html = pageHead('Forecast & simulation settings', 'Demand assumptions, capacity and simulation parameters', '<button class="btn primary" onclick="saveSimSettings()">Save settings</button>');
  html += card('Base monthly demand (units)', ptRow('sb', s.baseDemand, 100));
  html += card('Monthly demand growth (%)', ptRow('sg', s.growth, 0.5));
  html += card('Capacity and constraints', `<div class="grid g4 flat">
    ${field('Monthly capacity (units)', inp('sCap', s.monthlyCapacity, 'number'))}${field('Planned volume (units)', inp('sVol', s.plannedVolume, 'number'))}
    ${field('Max PHEV share (%)', inp('sPhev', s.maxShare.PHEV, 'number'))}${field('Max BEV share (%)', inp('sBev', s.maxShare.BEV, 'number'))}
    ${field('Battery module supply / month', inp('sBat', s.batterySupplyPerMonth, 'number'))}${field('Shift length (h)', inp('sShift', s.shiftHours, 'number'))}</div>`);
  html += card('Recommended mix used by the optimizer (%)', ptRow('sr', s.recommendedMix, 1) + '<p class="muted small">Must add up to 100%.</p>');
  return html;
}
function saveSimSettings() {
  const s = DB.simSettings, rec = {};
  PT.forEach(p => { rec[p] = +val('sr_' + p) || 0; });
  if (sum(PT.map(p => rec[p])) !== 100) return toast('Recommended mix must add up to 100%', 'err');
  PT.forEach(p => { s.baseDemand[p] = +val('sb_' + p) || 0; s.growth[p] = +val('sg_' + p) || 0; });
  s.recommendedMix = rec;
  s.monthlyCapacity = +val('sCap') || s.monthlyCapacity; s.plannedVolume = +val('sVol') || s.plannedVolume;
  s.maxShare = { PHEV: +val('sPhev') || 0, BEV: +val('sBev') || 0 };
  s.batterySupplyPerMonth = +val('sBat') || s.batterySupplyPerMonth; s.shiftHours = +val('sShift') || s.shiftHours;
  persist('simSettings', 'Update simulation settings', `Capacity ${s.monthlyCapacity}, planned ${s.plannedVolume}`); toast('Settings saved'); refresh();
}

function pgAudit() {
  const html = pageHead('Audit trail', 'History of data changes and user actions') +
    card('Activity', `<div class="filters" style="margin-bottom:14px">${inp('auQ', STATE.auditQ, 'search', `placeholder="Search action, role or detail" oninput="STATE.auditQ=this.value;auditUpdate()"`)}</div><div id="auditTbl"></div>`);
  afterQ.push(auditUpdate);
  return html;
}
function auditUpdate() {
  const q = STATE.auditQ.toLowerCase();
  const rows = (DB.audit || []).filter(a => !q || (a.action + ' ' + a.role + ' ' + a.detail + ' ' + a.user).toLowerCase().includes(q));
  const el = $('#auditTbl'); if (!el) return;
  el.innerHTML = table([['Time', a => fmtTime(a.time)], ['User', a => h(a.user)], ['Action', a => `<b>${h(a.action)}</b>`], ['Detail', a => h(a.detail)]], rows, 'No activity found.');
}

function pgDataMgmt() {
  const stored = (DB.meta && DB.meta.storedKeys) || [];
  let html = pageHead('Data management', 'Reset and restore the demo dataset');
  html += `<div class="grid g12">${card('Reset demo data', `<p style="margin-bottom:12px">Restores every editable collection to its original demo values. Use this before a new demo session.</p>
      <button class="btn primary" onclick="resetData()">Reset demo data</button>`)}
    ${card('Editable collections', table([['Collection', k => k], ['State at last load', k => stored.includes(k) ? badge('Changed') : badge('Default')]], COLLECTIONS) + '<p class="muted small mt">State reflects the last time the app loaded. Data is stored in Script Properties.</p>')}</div>`;
  return html;
}
function resetData() {
  openModal('Reset demo data', '<p>All changes made in the app will be replaced with the original demo dataset. Continue?</p>', () => {
    if (!hasGAS()) return;
    google.script.run.withSuccessHandler(d => { DB = d; normalize(); toast('Demo data restored'); refresh(); })
      .withFailureHandler(e => toast('Reset failed: ' + e.message, 'err')).resetDemoData();
  }, 'Reset data');
}

function pgSysStatus() {
  const integ = [['MES / production counters', 'Not connected'], ['PLC / SCADA machine data', 'Not connected'], ['ERP (materials, orders)', 'Not connected'], ['Vision camera stream', 'Not connected'], ['Single sign-on', 'Not connected'], ['AI / LLM service', 'Rule-based simulation']];
  let html = pageHead('System status', 'Active modules, data sources and integrations not yet available');
  html += kpiRow([kpi('Roles', Object.keys(ROLES).length, '5 operational + admin'), kpi('Modules enabled', sum(OP_ROLES.map(r => allowedFeatures(r).length)) + ' / ' + sum(OP_ROLES.map(r => FEATURES[r].length)), 'Operational roles'), kpi('Data source', 'Simulated', 'Script Properties'), kpi('Last load', fmtTime(DB.meta ? DB.meta.loadedAt : new Date().toISOString()), '')]);
  html += `<div class="grid g2">${card('Active modules per role', table([['Role', r => ROLES[r].name], ['Modules', r => `${allowedFeatures(r).length} of ${FEATURES[r].length}`, 'r'], ['Status', r => badge(allowedFeatures(r).length ? 'Active' : 'Disabled')]], OP_ROLES))}
    ${card('Integrations', table([['Integration', i => i[0]], ['Status', i => `<span class="badge">${i[1]}</span>`]], integ))}</div>`;
  html += '<div class="callout">This is a prototype. Role selection and permissions simulate access control and are not a security system. All data is simulated.</div>';
  return html;
}
